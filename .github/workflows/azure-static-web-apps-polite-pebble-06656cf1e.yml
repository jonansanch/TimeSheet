name: Deploy WebUI - polite-pebble

on:
  push:
    branches: [ master ]
    paths:
      - 'Fronted/**'
      - '.github/workflows/azure-static-web-apps-polite-pebble-06656cf1e.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [ master ]
    paths:
      - 'Fronted/**'
  workflow_dispatch:

env:
  WEBUI_PROJECT: Fronted/src/WebUI/KPG.Timesheet.WebUI.csproj

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Oryx (el builder de SWA) no compila .NET 10 todavia, se publica aqui
      # y se sube el wwwroot ya generado con skip_app_build.
      - name: Publish Blazor WASM
        run: dotnet publish ${{ env.WEBUI_PROJECT }} -c Release -o published

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_PEBBLE_06656CF1E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "published/wwwroot"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_PEBBLE_06656CF1E }}
          action: "close"
